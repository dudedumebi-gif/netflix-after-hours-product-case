name: Publish v1.0.0 final release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out final release
        uses: actions/checkout@v4
      - name: Create GitHub release and attach portfolio assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists"
          else
            gh release create v1.0.0 \
              case-study/Netflix_After_Hours_Final_Case_Study.pdf \
              release-package/Netflix_After_Hours_Executive_Release_Deck.pptx \
              launch-package/Netflix_After_Hours_5_Minute_Case_Presentation_Final.pptx \
              index.html \
              --target "$GITHUB_SHA" \
              --title "Netflix After Hours v1.0 Final" \
              --notes-file release-package/RELEASE_NOTES.md \
              --latest
          fi
